name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test
        run: uv sync --group dev && uv run pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test and build CLI
        run: |
          go test ./...
          go build -o bin/dgm-mosaic-cli ./cmd/dgm-mosaic
