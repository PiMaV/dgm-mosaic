<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGM mosaic → BLITZ</title>
  <style>
    :root {
      --bg: #141414;
      --panel: #1e1e1e;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #ffe066;
      --line: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.4 system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type=text] {
      flex: 1; min-width: 200px; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); padding: 8px 10px; border-radius: 4px;
    }
    button, .radio label {
      background: #2a2a2a; color: var(--text); border: 1px solid var(--line);
      padding: 8px 12px; border-radius: 4px; cursor: pointer;
    }
    button.primary { background: #3d5a1f; border-color: #5a8a2f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 280px; gap: 0; min-height: 0; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    #stage {
      position: relative; background: #0a0a0a; min-height: 360px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #stage img { max-width: 100%; max-height: 70vh; display: block; user-select: none; }
    #sel {
      position: absolute; border: 2px solid var(--accent); background: rgba(255,255,255,0.08);
      pointer-events: none; display: none;
    }
    aside {
      border-left: 1px solid var(--line); padding: 16px; background: var(--panel);
      display: flex; flex-direction: column; gap: 12px;
    }
    .meta { color: var(--muted); font-size: 13px; }
    .radio { display: flex; flex-direction: column; gap: 6px; }
    .radio label { display: flex; gap: 8px; align-items: center; }
    #status { color: var(--muted); white-space: pre-wrap; font-size: 13px; }
    .hint { font-size: 12px; color: var(--muted); }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>DGM mosaic → BLITZ</h1>
    <div class="row" style="flex:1">
      <input id="folder" type="text" readonly placeholder="Tile folder…">
      <button id="browse" type="button">Browse…</button>
      <button id="reload" type="button">Reload</button>
    </div>
  </header>
  <main>
    <div id="stage">
      <span class="meta" id="empty">Drop is disabled — use Browse (native path).</span>
      <img id="preview" alt="" hidden>
      <div id="sel"></div>
    </div>
    <aside>
      <div class="meta" id="meta">No folder loaded.</div>
      <div class="radio" id="dtypes">
        <label><input type="radio" name="dtype" value="u16cm" checked> uint16 cm <span data-size="u16cm"></span></label>
        <label><input type="radio" name="dtype" value="u8stretch"> uint8 stretch <span data-size="u8stretch"></span></label>
        <label><input type="radio" name="dtype" value="u8step"> uint8 step <span data-size="u8step"></span></label>
        <label><input type="radio" name="dtype" value="f32"> float32 m <span data-size="f32"></span></label>
      </div>
      <div class="row">
        <button class="primary" id="send" type="button" disabled>Send to BLITZ</button>
        <button id="save" type="button" disabled>Save .npy</button>
      </div>
      <p class="hint">Stream: <code id="connect">…</code></p>
      <div id="status"></div>
    </aside>
  </main>
  <script>
    const state = {
      folder: "", rows: 1, cols: 1, box: [0,0,0,0],
      drag: null, imgRect: null
    };

    const $ = (id) => document.getElementById(id);

    async function api(path, body) {
      const r = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? {"Content-Type":"application/json"} : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || r.statusText);
      return j;
    }

    function dtype() {
      return document.querySelector('input[name=dtype]:checked').value;
    }

    function setStatus(t) { $("status").textContent = t || ""; }

    async function refreshState() {
      const s = await api("/api/state");
      $("connect").textContent = s.connect;
      if (s.folder) {
        $("folder").value = s.folder;
        await openFolder(s.folder);
      }
    }

    async function openFolder(folder) {
      setStatus("Inspecting tiles…");
      const info = await api("/api/open", {folder});
      state.folder = info.folder;
      state.rows = info.tile_rows;
      state.cols = info.tile_cols;
      state.box = [0, 0, info.tile_rows-1, info.tile_cols-1];
      $("folder").value = info.folder;
      $("meta").textContent =
        `${info.tiles} tiles · ${info.width}×${info.height} px · ${info.pixel_m} m` +
        (info.crs ? ` · ${info.crs}` : "") +
        (info.holes ? ` · ${info.holes} holes` : "");
      for (const [k,v] of Object.entries(info.sizes || {})) {
        const el = document.querySelector(`[data-size="${k}"]`);
        if (el) el.textContent = `(${v})`;
      }
      $("send").disabled = false;
      $("save").disabled = false;
      await loadPreview();
      setStatus("");
    }

    async function loadPreview() {
      setStatus("Building preview…");
      const p = await api("/api/preview", {folder: state.folder});
      const img = $("preview");
      img.src = p.png;
      img.hidden = false;
      $("empty").hidden = true;
      img.onload = () => { drawSel(); };
      setStatus("");
    }

    function tileAt(clientX, clientY, clamp) {
      const img = $("preview");
      const rect = img.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      let x = clientX, y = clientY;
      if (x < rect.left || y < rect.top || x > rect.right || y > rect.bottom) {
        if (!clamp) return null;
        x = Math.min(Math.max(x, rect.left), rect.right);
        y = Math.min(Math.max(y, rect.top), rect.bottom);
      }
      const fx = (x - rect.left) / rect.width;
      const fy = (y - rect.top) / rect.height;
      const c = Math.min(state.cols-1, Math.max(0, Math.floor(fx * state.cols)));
      const r = Math.min(state.rows-1, Math.max(0, Math.floor(fy * state.rows)));
      return [r,c];
    }

    function drawSel() {
      const img = $("preview");
      const stage = $("stage");
      const sel = $("sel");
      const rect = img.getBoundingClientRect();
      const srect = stage.getBoundingClientRect();
      if (img.hidden || !rect.width) { sel.style.display = "none"; return; }
      const [r0,c0,r1,c1] = state.box;
      const cellW = rect.width / state.cols;
      const cellH = rect.height / state.rows;
      sel.style.display = "block";
      sel.style.left = (rect.left - srect.left + c0 * cellW) + "px";
      sel.style.top = (rect.top - srect.top + r0 * cellH) + "px";
      sel.style.width = Math.max(1, (c1-c0+1)*cellW) + "px";
      sel.style.height = Math.max(1, (r1-r0+1)*cellH) + "px";
    }

    $("preview").addEventListener("mousedown", (e) => {
      const t = tileAt(e.clientX, e.clientY, false);
      if (!t) return;
      state.drag = t;
      state.box = [t[0], t[1], t[0], t[1]];
      drawSel();
    });
    window.addEventListener("mousemove", (e) => {
      if (!state.drag) return;
      const t = tileAt(e.clientX, e.clientY, true);
      if (!t) return;
      state.box = [
        Math.min(state.drag[0], t[0]), Math.min(state.drag[1], t[1]),
        Math.max(state.drag[0], t[0]), Math.max(state.drag[1], t[1])
      ];
      drawSel();
    });
    window.addEventListener("mouseup", () => { state.drag = null; });
    window.addEventListener("resize", drawSel);

    $("browse").onclick = async () => {
      try {
        const j = await api("/api/browse", {});
        if (j.cancelled) return;
        await openFolder(j.folder);
      } catch (e) { setStatus("Error: " + e.message); }
    };
    $("reload").onclick = async () => {
      if (!state.folder) return;
      try { await openFolder(state.folder); } catch (e) { setStatus("Error: " + e.message); }
    };
    $("send").onclick = async () => {
      try {
        setStatus("Building mosaic and sending…");
        const j = await api("/api/send", {
          folder: state.folder, dtype: dtype(), box: state.box, step_m: 0.25, ref: "min"
        });
        setStatus(`Pushed ${j.mode} ${j.shape.join("×")} (${j.mb.toFixed(1)} MB).\nConnect BLITZ Stream to ${j.connect}`);
      } catch (e) { setStatus("Error: " + e.message); }
    };
    $("save").onclick = async () => {
      try {
        setStatus("Saving…");
        const j = await api("/api/save", {
          folder: state.folder, dtype: dtype(), box: state.box, step_m: 0.25, ref: "min"
        });
        setStatus("Wrote " + j.path);
      } catch (e) { setStatus("Error: " + e.message); }
    };

    refreshState().catch(e => setStatus("Error: " + e.message));
  </script>
</body>
</html>
