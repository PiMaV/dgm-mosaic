[project]
name = "dgm-mosaic"
version = "0.1.0"
description = "DGM GeoTIFF mosaic stage for BLITZ and DONNER"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "Philipp Mattern", email = "mattern@mess.engineering" },
]

dependencies = [
    "numpy>=2.0.2,<3",
    "PyQt6>=6.0.0,<7",
    "flask>=3.0",
    "flask-socketio>=5.3",
]

[project.scripts]
dgm-mosaic = "dgm_mosaic.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dgm_mosaic"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyinstaller>=6.16.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
